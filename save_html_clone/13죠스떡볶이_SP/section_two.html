<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                #two { display: flex;}

                /* #two #two_b { width:100%; padding-bottom: 43%; background-image: url(./img/back.jpg); background-position: bottom left; background-repeat: no-repeat;} */
                /* padding-bottom을 없애고 안에 내용물을 채워서 높이를 맞추면 되나? */

                #two #two_b { width:100%; background-image: url(./img/back.jpg); background-position: bottom left; background-repeat: no-repeat; display: flex; justify-content: center;}
                /* #two #two_b #two_content {border:1px solid white; width: 1200px; height: 500px; margin: 10% 0; display: flex; ;} */
                #two #two_b #two_content {border:1px solid white; width: 1200px; height: 100%; display: flex;}
                #two #two_b #two_content #two_left {width:35%; display: flex; flex-direction: column; margin: 16% 0% 10% 0%; }
                #two #two_b #two_content #two_left #two_left_img1 {width:15vw; margin-bottom: 10px;}
                #two #two_b #two_content #two_left #two_left_img2 {width:15vw;}
                #two #two_b #two_content #two_left #two_left_text {text-align: left; color:#ffffff; font-size: 22px; font-weight: 400; line-height: 1.5em; font-family: "PretendardVariable", Sans-serif;}
                #two #two_b #two_content #two_left #two_left_imgbox { margin-top:80px; display: flex;}
                /* #two #two_b #two_content #two_left #two_left_imgbox div { } */
                #two #two_b #two_content #two_left #two_left_imgbox div .in_img {max-width: 80%;}

                #two #two_b #two_content #two_right {border: 1px solid yellow; width:65%; display: flex; justify-content: center;}
                /* #two #two_b #two_content #two_right #two_right_img1 { background-image: url(./img/Asset-19-2.png); max-width: 620px; height: 100%; position: absolute;} */
                /* #two #two_b #two_content #two_right #two_right_img1 { position: absolute; max-width: 50%; bottom: -10%;} */
                /* #two #two_b #two_content #two_right #two_right_img1 { width:50%; display: none; position: absolute;} */
                /* #two #two_b #two_content #two_right #two_right_img1 { width:714px; display: none; bottom:0; clear:both} */
                #two #two_b #two_content #two_right #two_right_img1 { background-image: url(./img/Asset-19-2.png); background-position: bottom center; background-repeat: no-repeat; background-size: 100% auto; width:93%;min-height: 700px;}
                /* #two #two_b #two_content #two_right #two_right_img2 { position: absolute; right: 0; margin-top:355px; margin-right: 140px; width: 280px;} */
                /* #two #two_b #two_content #two_right #two_right_img2 { right: 0; margin-top:355px; width: 280px; margin: 230px -20px 0px 0px; */
                #two #two_b #two_content #two_right #two_right_img2 { right: 0; margin: 230px -20px 0px 0px; padding: 0px 0px 0px 0px; width: 280px; text-align: right; height: 76px; position: absolute;}

                @keyframes slide {
                    0% {
                        transform: translate3d(0, 100%, 0);
                        visibility: visible;
                    }
                    100% {  
                        transform: translate3d(0, 0, 0);
                    }
                }
    </style>
</head>
<body>
    <section id="two">
        <div id="two_b">
            <div id="two_content">
                <div id="two_left">
                    <img id="two_left_img1" src="img/Asset-3.png" alt="#">
                    <img id="two_left_img2" src="img/Asset-2.png" alt="#">
                    <div id="two_left_text">간편한 조리로 배달 운영 최적화 낮은 원가율과 최소 인원 운영으로 수익보장!</div>
                    <div id="two_left_imgbox">
                        <div>
                            <img id="two_left_img3" class="in_img" src="img/Asset-5.png" alt="#">
                        </div>
                        <div>
                            <img id="two_left_img4" class="in_img" src="img/Asset-6.png" alt="#">
                        </div>
                        <div>
                            <img id="two_left_img5" class="in_img" src="img/Asset-7.png" alt="#">
                        </div>
                    </div>
                </div>
                <div id="two_right">
                    <!-- <img id="two_right_img1" src="./img/Asset-19-2.png" alt="#"> -->
                    <div id="two_right_img1"></div>
                    <img id="two_right_img2" src="./img/Asset-12-2.png" alt="">
                </div>
            </div>
        </div>
    </section>

    <script>
        
        // let two_right_img1 = document.getElementById("two_right_img1").getBoundingClientRect().top+window.scrollY;
        let two_right_img1 = (document.getElementById("two_right_img1").getBoundingClientRect().top + window.scrollY *2.0) - (document.getElementById("two_right_img1").getBoundingClientRect().top + window.scrollY);
        
        console.log("two_right_img1: "+two_right_img1)

        window.addEventListener('scroll', function(){
            let scroll_hv2 = window.scrollY;

            if(two_right_img1 <= scroll_hv2){
                document.getElementById("two_right_img1").style.animation="slide 1.2s ease forwards"
                document.getElementById("two_right_img1").style.display="block"
            }
        })

    </script>
</body>
</html>
