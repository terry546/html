<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div { border: 1px solid red; text-align: center}
    ul {
            display: inline-block;  /* 두 개의 리스트를 가로로 배치 */
            margin: 0 10px;         /* 리스트 사이 간격 */
            padding: 0;
    }
        li {
            display: block;         /* 리스트 항목을 세로 정렬 */
            text-align: center;     /* 텍스트 가운데 정렬 */
            list-style: none;       /* 불릿 제거 (선택사항) */
            width: 30px;            /* 항목 크기 맞춤 */
        }
    </style>
</head>
<body>
    <div>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
    </div>
    
</body>
</html>
