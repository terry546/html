<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <style>
        div {
            border: 1px solid red;
            display: flex;               /* Flexbox 사용 */
            justify-content: center;     /* 수평 중앙 정렬 */
            gap: 20px;                   /* ul 사이 간격 */
            padding: 20px;
        }

        ul {
            padding: 0;
            margin: 0;
        }

        li {
            display: block;              /* 세로로 나열 */
            text-align: center;          /* 텍스트 중앙 */
            list-style: none;            /* 불릿 제거 */
            width: 30px;
        }
    </style>
</head>
<body>
    <div>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
    </div>
</body>
</html>
