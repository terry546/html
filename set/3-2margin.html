<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* seven_b에 display:flex를 추가하면 serve_content에 내용이 중앙 정렬이 안된다
        display:flex 속성이 아이템들을 수직 수평으로 만드는 기능인데 자식에 자식까지 다 수평으로 만들진 않을껀데
        
        */

        /* #seven_b { background-image: url(./img/Asset-10-80.jpg); background-size: fill; width:100%;background-position: center left; background-repeat: no-repeat;  } */
        #seven_b { background-image: url(./img/Asset-10-80.jpg); background-size: fill; width:100%;background-position: center left; background-repeat: no-repeat; display: flex; }

        #seven_b #seven_content { max-width: 1250px; min-height: 90vh; display: flex; justify-content: center; margin: 0 auto; align-items: center;}
        /* #seven_b #seven_content { max-width: 1250px; min-height: 90vh; display: flex; justify-content: center; align-items: center; } */

        #seven_b #seven_content #seven_one {display: flex; flex-direction: column; margin-bottom: 110px;}
        #seven_b #seven_content #seven_one #so_content1 { width:10vw }
        #seven_b #seven_content #seven_one #so_content2 { max-width: 80%; }
        #seven_b #seven_content #seven_one #so_content3 { text-align: left; color: #1A1A1A; font-family: "PretendardVariable", Sans-serif; font-size: 25px; font-weight: 400; line-height: 1.5em; }

        #seven_b #seven_content #seven_two {width:65%; z-index: 1; height: 100%;}
        #seven_b #seven_content #seven_two img {position: relative; right:-35%;  }
        #seven_b #seven_content #seven_b2 {background: url(./img/food_img.png); background-position: bottom right; background-repeat: no-repeat; background-size: contain; height: 90%; width:100%; position: absolute;}
    </style>
    </head>
    <body>
        <div id="seven_b">
            <div id="seven_content">
                <div id="seven_one">
                    <img id="so_content1" src="./img/more.png" alt="">
                    <img id="so_content2" src="./img/Asset-3-2.png" alt="">
                    <div id="so_content3">HOT한 메뉴들이 더 맛있게 돌아왔다.<br>
                        매운맛도 3단계로 조절가능!
                    </div>
                </div>
                <div id="seven_two">
                    <img src="./img/hot_and_sweet-1.png" alt="">
                </div>
                <div id="seven_b2"></div>
            </div>
        </div>
    </body>
</html>
