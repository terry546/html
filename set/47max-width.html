<!-- max-width값 이상 크기가 늘어나지 않는다
max-width값 이하로는 크기가 줄어든다 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #mwex { border:1px solid red; width:500px; height: 500px; max-width: 400px;}
    
</style>
CSS 속성은 요소의 최대 너비를 설정합니다. 속성 의 사용된 값이 . 에서 지정한 값보다 커지는 것을 방지합니다 .
<body>
    <div id="mwex"></div>
</body>
</html>
