<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parents { border:1px solid red; width:1px; margin:0 auto }
        #child { height: 2000px; }


        /* #bb_wrap {height: 160px; background: rgb(223, 191, 191); width:1000px} */
        /* #bb_wrap {height: 160px; background: rgb(223, 191, 191); width:1000px;
            bottom:0px; position: fixed; 
        animation: bottom_slide_up 1s;} */
        #bb_wrap {height: 160px; background: rgb(223, 191, 191); width:1000px;
            bottom:0px; position: fixed; display: none;}

        #bb_wrap #i_cross { position: absolute; right:0; margin: 10px 10px 0 0 }

        #bb_b {  }

        /* @keyframes bottom_slide_up { 
            0% {
                top:0px
            }
            100% {
                top:160px
            }
        } */

        @keyframes bottom_slide_up { 
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        @keyframes bottom_slide_down { 
            from {
                transform: translateY(0%);
            }
            to {
                transform: translateY(100%);
            }
        }
    </style>
</head>
<body>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <div id="parents">
            <div id="child"></div>
            <div id="child2"></div>
        </div>

        <footer>
            <section id="bottom_banner">
                <div id="bb_wrap">
                    <img id="i_cross" src="./img/port_iconCloseB.svg" alt="">
                    <div id="bb_b">

                    </div>
                </div>
            </section>
        </footer>
    
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
        let hei= $("#child2").offset().top;
        let up_banner = hei - ($(window).height()*1.5);
        console.log($(window).height()*1.5, hei)
        console.log(up_banner)

        $(window).scroll(function() {
          let value = $(this).scrollTop();
        // body나 태그 높이에 맞춰서 value보다 값이 커졌을때 배너가 나오게 해야한다.
          if(700< value){
            document.getElementById("bb_wrap").style.animation = "bottom_slide_up 1s";
            document.getElementById("bb_wrap").style.display = "block";
          }
          console.log(value)
        })
        </script>
        <script>
            // X 아이콘 클릭하면 보이는 창이 내려가는 기능 만들기
            document.getElementById("i_cross").onclick = function(){
                // document.getElementById("bb_wrap").style.background="red"
                document.getElementById("bb_wrap").style.animation = "bottom_slide_down 1s" 
                setTimeout(function() {
                    document.getElementById("bb_wrap").style.display = "none";
                }, 900);
                // setTimeout(document.getElementById("bb_wrap").style.display = "none", 2000)
                // document.getElementById("bb_wrap").style.display = "none";
            }
        </script>
    </body>
    </html>
</body>
</html>
